name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-mock pysam

      - name: Run unit tests
        run: |
          pytest tests/test_*.py -v
        env:
          PYTHONPATH: .

  integration-tests:
    runs-on: gpu-t4-4-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/chrome
          sudo rm -rf /home/runner/.rustup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/google/chrome
          sudo rm -rf /opt/microsoft/msedge
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker image prune --all --force
          sudo docker system prune --all --volumes --force
          echo "Disk space after cleanup:"
          df -h


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: virnucpro-cuda:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python for integration tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install integration test dependencies
        run: |
          pip install pytest pytest-mock pysam

      - name: Run integration tests
        run: |
          # Note: GPU tests will be skipped on GitHub Actions (no GPU available)
          # Only empty BAM test and unit tests will run
          pytest tests/integration/ -v
        env:
          PYTHONPATH: .
          VIRNUCPRO_DOCKER_IMAGE: virnucpro-cuda:test
