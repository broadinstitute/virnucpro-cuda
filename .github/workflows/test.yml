name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-mock pysam

      - name: Run unit tests
        run: |
          pytest tests/test_*.py -v
        env:
          PYTHONPATH: .

  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: virnucpro-cuda:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python for integration tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install integration test dependencies
        run: |
          pip install pytest pytest-mock pysam

      - name: Run integration tests (CPU mode)
        run: |
          pytest tests/integration/ -v
        env:
          PYTHONPATH: .
          VIRNUCPRO_DOCKER_IMAGE: virnucpro-cuda:test
